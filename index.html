<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/src/assets/junior-dev-logo.jpg" />
    <meta property="og:image" content="/src/assets/junior-dev-logo.jpg" />
    <meta name="twitter:image" content="/src/assets/junior-dev-logo.jpg" />
    <meta name="theme-color" content="#0a1033" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
    <title>Juniors.Dev</title>
    <script>
      (function () {
        var theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        try {
          var stored = JSON.parse(localStorage.getItem("theme-storage") || "{}");
          if (stored.state && stored.state.userTheme) {
            theme = stored.state.userTheme;
          }
        } catch (e) {}
        if (theme === "dark") document.documentElement.classList.add("dark");
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
